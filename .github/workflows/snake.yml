> Save this file in your profile repo at: `.github/workflows/snake.yml`

```yaml
name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build the snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=#6EE7FF&color_dots=#0B1220,#123047,#1E5F73,#3FA7C4,#6EE7FF

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```

The snake colours above are set to your portfolio's cyan palette rather than the default green.

## After you commit it

1. Go to the **Actions** tab in the `mariamoussa` repo.
2. If prompted, click **"I understand my workflows, go ahead and enable them"**.
3. Select **Generate snake animation** in the sidebar, then **Run workflow**.
4. Wait about a minute. A new branch called **`output`** appears containing `snake.svg`, `snake-dark.svg` and `snake.gif`.

Once that branch exists, this block in your README works. It swaps automatically between light and dark GitHub themes:

```markdown
<picture>
  <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/mariamoussa/mariamoussa/output/snake-dark.svg" />
  <source media="(prefers-color-scheme: light)" srcset="https://raw.githubusercontent.com/mariamoussa/mariamoussa/output/snake.svg" />
  <img alt="Contribution graph snake animation" src="https://raw.githubusercontent.com/mariamoussa/mariamoussa/output/snake.svg" />
</picture>
```

If the workflow fails with a permissions error: **Settings → Actions → General → Workflow permissions → Read and write permissions → Save**, then re-run it.
